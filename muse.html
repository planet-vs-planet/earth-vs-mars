<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EARTH vs MARS — 宇宙バトル（Muse版）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#030612; font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:#eaf2ff; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(1200px 700px at 70% 20%, #0b1e4b 0%, #030612 60%); }
  #stage { position:relative; width:min(100vw, 177.78vh); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; border-radius:10px; box-shadow:0 0 60px rgba(40,110,255,.35), 0 0 0 1px rgba(120,170,255,.25); background:#050a1e; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(2,6,20,.72); backdrop-filter: blur(3px); border-radius:10px; z-index:5; }
  .overlay.hidden { display:none; }
  .title { font-size:min(6.2vw,64px); font-weight:900; letter-spacing:.06em; line-height:1.15;
           background:linear-gradient(90deg,#57b6ff 0%,#7dffb2 45%,#ff9a5c 60%,#ff5c5c 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
           text-shadow:0 0 34px rgba(90,160,255,.25); }
  .sub { margin-top:10px; font-size:min(2vw,19px); color:#bcd3ff; }
  .howto { margin-top:22px; font-size:min(1.7vw,16px); line-height:1.9; color:#dbe8ff; background:rgba(10,24,58,.6); border:1px solid rgba(120,170,255,.35); padding:12px 26px; border-radius:12px; }
  .howto b { color:#8fd0ff; }
  .btn { margin-top:26px; font-size:min(2.2vw,22px); font-weight:800; color:#04122e; background:linear-gradient(180deg,#8fd0ff,#3f8cff); border:none; border-radius:999px; padding:13px 44px; cursor:pointer; box-shadow:0 6px 24px rgba(63,140,255,.5); }
  .btn:hover { filter:brightness(1.1); }
  #resultTitle { font-size:min(7vw,76px); font-weight:900; letter-spacing:.08em; }
  .win { color:#7dffb2; text-shadow:0 0 40px rgba(80,255,170,.55); }
  .lose { color:#ff6b6b; text-shadow:0 0 40px rgba(255,90,90,.55); }
  #resultStats { margin-top:12px; font-size:min(2vw,19px); color:#cfe1ff; line-height:1.8; }
  #hud-help { position:absolute; left:10px; bottom:8px; font-size:12px; color:rgba(190,214,255,.75); z-index:3; text-shadow:0 1px 3px #000; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hud-help">移動: WASD / 矢印キー　攻撃: Space　必殺技: E（クールダウンあり）　リスタート: R</div>

    <div id="startScreen" class="overlay">
      <div class="title">EARTH vs MARS</div>
      <div class="sub">— 宇宙バトル —　地球を操作して、火星を倒せ！</div>
      <div class="howto">
        <b>WASD / 矢印キー</b>：移動　　<b>Space</b>：通常攻撃（押しっぱなしOK）<br>
        <b>E</b>：必殺技「オーラブラスト」（強力・クールダウン6秒）<br>
        敵の弾を避けながら、火星のHPを0にすれば勝利！
      </div>
      <button class="btn" id="startBtn">▶ ゲームスタート</button>
    </div>

    <div id="resultScreen" class="overlay hidden">
      <div id="resultTitle">VICTORY!</div>
      <div id="resultStats"></div>
      <button class="btn" id="restartBtn">↻ もう一度プレイ（R）</button>
    </div>
  </div>
</div>
<script>
"use strict";
const W = 1280, H = 720;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");
const resultScreen = document.getElementById("resultScreen");
const resultTitle = document.getElementById("resultTitle");
const resultStats = document.getElementById("resultStats");
const DEMO = new URLSearchParams(location.search).get("demo") === "1";

// ---------- audio (simple synth, no external files) ----------
let AC = null;
function beep(freq, dur, type, vol, slide) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), AC.currentTime + dur);
    g.gain.value = vol || 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  shoot: () => beep(880, 0.07, "square", 0.03, 220),
  eshoot: () => beep(140, 0.12, "sawtooth", 0.04, 60),
  hit: () => beep(200, 0.06, "triangle", 0.05, 90),
  special: () => { beep(120, 0.45, "sawtooth", 0.09, 1400); beep(60, 0.45, "square", 0.05, 900); },
  boom: () => beep(90, 0.7, "sawtooth", 0.12, 30),
};

// ---------- background ----------
const stars = [];
for (let i = 0; i < 220; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.6+0.4, s: 6+Math.random()*22, tw: Math.random()*6.28 });
const nebulae = [
  { x: 300, y: 150, r: 340, c: "rgba(88,60,220,0.16)" },
  { x: 980, y: 520, r: 380, c: "rgba(20,120,220,0.13)" },
  { x: 1050, y: 120, r: 260, c: "rgba(255,90,140,0.08)" },
  { x: 180, y: 580, r: 300, c: "rgba(0,200,190,0.08)" },
];

// ---------- game state ----------
let state = "title"; // title | playing | over
let player, mars, bullets, ebullets, particles, dmgNums, shake, startTime, elapsed, beam;
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyR" && state === "over") startGame();
  if ((e.code === "Enter" || e.code === "Space") && state === "title") startGame();
});
addEventListener("keyup", e => { keys[e.code] = false; });

function reset() {
  player = { x: 210, y: H/2, r: 30, hp: 100, max: 100, fireCd: 0, specialCd: 0, flash: 0, invuln: 0 };
  mars   = { x: W-230, y: H/2, r: 36, hp: 180, max: 180, fireCd: 1.2, flash: 0, t: 0, phase: 1 };
  bullets = []; ebullets = []; particles = []; dmgNums = [];
  shake = 0; beam = null; elapsed = 0; startTime = performance.now();
}
function startGame() {
  reset(); state = "playing";
  startScreen.classList.add("hidden"); resultScreen.classList.add("hidden");
}
document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;

function endGame(win) {
  state = "over";
  explode(win ? mars.x : player.x, win ? mars.y : player.y, win ? ["#ff9a5c","#ff5c5c","#ffd76b"] : ["#57b6ff","#7dffb2","#ffffff"], 130);
  shake = 22; sfx.boom();
  setTimeout(() => {
    resultTitle.textContent = win ? "VICTORY!" : "GAME OVER";
    resultTitle.className = win ? "win" : "lose";
    resultStats.innerHTML = (win ? "火星を倒した！地球は守られた。" : "地球が破壊されてしまった…") +
      "<br>タイム: " + elapsed.toFixed(1) + " 秒　／　地球の残りHP: " + Math.max(0, Math.ceil(player.hp)) + " ／ 火星の残りHP: " + Math.max(0, Math.ceil(mars.hp));
    resultScreen.classList.remove("hidden");
  }, 900);
}

function explode(x, y, colors, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*6.283, sp = 40 + Math.random()*330;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.6+Math.random()*0.9, t: 0, r: 1.5+Math.random()*3.5, c: colors[(Math.random()*colors.length)|0] });
  }
}
function sparks(x, y, colors, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*6.283, sp = 30 + Math.random()*160;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.25+Math.random()*0.35, t: 0, r: 1+Math.random()*2.2, c: colors[(Math.random()*colors.length)|0] });
  }
}
function dmgNum(x, y, txt, color) { dmgNums.push({ x, y, txt, color, t: 0 }); }

// ---------- drawing planets ----------
function drawEarth(p) {
  ctx.save(); ctx.translate(p.x, p.y);
  const glow = ctx.createRadialGradient(0,0,p.r*0.9, 0,0,p.r*1.7);
  glow.addColorStop(0,"rgba(70,150,255,0.35)"); glow.addColorStop(1,"rgba(70,150,255,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,p.r*1.7,0,6.283); ctx.fill();
  const g = ctx.createRadialGradient(-p.r*0.4,-p.r*0.4,p.r*0.2, 0,0,p.r);
  g.addColorStop(0,"#7ec8ff"); g.addColorStop(0.55,"#2b7fe0"); g.addColorStop(1,"#0d3f8f");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,p.r,0,6.283); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,p.r,0,6.283); ctx.clip();
  ctx.fillStyle = "#3fae5c";
  blob(-0.35,-0.3,0.42); blob(0.3,0.42,0.36); blob(0.45,-0.42,0.26); blob(-0.5,0.35,0.24);
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  blob(-0.1,-0.55,0.2); blob(0.25,0.05,0.16); blob(-0.35,0.55,0.18);
  ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.beginPath(); ctx.ellipse(0,-p.r*0.92,p.r*0.34,p.r*0.13,0,0,6.283); ctx.fill();
  ctx.restore();
  if (p.flash > 0) { ctx.globalAlpha = Math.min(1, p.flash*6); ctx.fillStyle = "#ff4444"; ctx.beginPath(); ctx.arc(0,0,p.r,0,6.283); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore();
  function blob(bx, by, br) { ctx.beginPath(); ctx.ellipse(bx*p.r, by*p.r, br*p.r, br*p.r*0.72, bx*2, 0, 6.283); ctx.fill(); }
}
function drawMars(m) {
  ctx.save(); ctx.translate(m.x, m.y);
  const glow = ctx.createRadialGradient(0,0,m.r*0.9, 0,0,m.r*1.7);
  glow.addColorStop(0,"rgba(255,110,60,0.32)"); glow.addColorStop(1,"rgba(255,110,60,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,m.r*1.7,0,6.283); ctx.fill();
  const g = ctx.createRadialGradient(-m.r*0.4,-m.r*0.4,m.r*0.2, 0,0,m.r);
  g.addColorStop(0,"#ffb37e"); g.addColorStop(0.5,"#e05f26"); g.addColorStop(1,"#8f2d0d");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,m.r,0,6.283); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,m.r,0,6.283); ctx.clip();
  ctx.fillStyle = "rgba(120,30,5,0.5)";
  crater(-0.3,-0.2,0.2); crater(0.35,0.3,0.26); crater(0.1,-0.45,0.14); crater(-0.45,0.4,0.16);
  ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.beginPath(); ctx.ellipse(0,-m.r*0.95,m.r*0.3,m.r*0.11,0,0,6.283); ctx.fill();
  if (m.hp < m.max*0.5) { // damage cracks glow when weakened
    ctx.strokeStyle = "rgba(255,210,80," + (0.55+0.35*Math.sin(performance.now()/90)) + ")"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-m.r*0.6,-m.r*0.1); ctx.lineTo(-m.r*0.15,m.r*0.15); ctx.lineTo(-m.r*0.3,m.r*0.55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m.r*0.5,-m.r*0.5); ctx.lineTo(m.r*0.2,-m.r*0.05); ctx.lineTo(m.r*0.55,m.r*0.3); ctx.stroke();
  }
  ctx.restore();
  if (m.flash > 0) { ctx.globalAlpha = Math.min(1, m.flash*6); ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(0,0,m.r,0,6.283); ctx.fill(); ctx.globalAlpha = 1; }
  // angry eyes
  ctx.fillStyle = "#2b0d02";
  ctx.beginPath(); ctx.arc(-m.r*0.32, -m.r*0.08, m.r*0.09, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc( m.r*0.32, -m.r*0.08, m.r*0.09, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "#2b0d02"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-m.r*0.5,-m.r*0.34); ctx.lineTo(-m.r*0.14,-m.r*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( m.r*0.5,-m.r*0.34); ctx.lineTo( m.r*0.14,-m.r*0.2); ctx.stroke();
  ctx.restore();
  function crater(cx, cy, cr) { ctx.beginPath(); ctx.arc(cx*m.r, cy*m.r, cr*m.r, 0, 6.283); ctx.fill(); }
}

// ---------- HUD ----------
function hpBar(x, y, w, ratio, colorA, colorB, label, alignRight) {
  ctx.save();
  ctx.fillStyle = "rgba(6,14,34,0.75)"; roundRect(x-4, y-20, w+8, 44, 10); ctx.fill();
  ctx.strokeStyle = "rgba(140,180,255,0.5)"; ctx.lineWidth = 1; roundRect(x-4, y-20, w+8, 44, 10); ctx.stroke();
  ctx.fillStyle = "#dbe8ff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = alignRight ? "right" : "left";
  ctx.fillText(label, alignRight ? x+w : x, y-6);
  ctx.fillStyle = "rgba(255,255,255,0.15)"; roundRect(x, y, w, 14, 7); ctx.fill();
  const grad = ctx.createLinearGradient(x, y, x+w, y); grad.addColorStop(0, colorA); grad.addColorStop(1, colorB);
  ctx.fillStyle = grad; if (ratio > 0) { roundRect(x, y, w*Math.max(0, ratio), 14, 7); ctx.fill(); }
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawHUD() {
  hpBar(26, 40, 430, player.hp/player.max, "#39d0ff", "#2bff88", "EARTH  HP " + Math.max(0,Math.ceil(player.hp)) + " / " + player.max, false);
  hpBar(W-456, 40, 430, mars.hp/mars.max, "#ff5c5c", "#ffb35c", "MARS  HP " + Math.max(0,Math.ceil(mars.hp)) + " / " + mars.max, true);
  // special cooldown
  const cx = 26, cy = H-58, cw = 300;
  ctx.save();
  ctx.fillStyle = "rgba(6,14,34,0.75)"; roundRect(cx-4, cy-4, cw+8, 40, 10); ctx.fill();
  ctx.strokeStyle = "rgba(140,180,255,0.5)"; roundRect(cx-4, cy-4, cw+8, 40, 10); ctx.stroke();
  const ready = player.specialCd <= 0;
  ctx.fillStyle = "rgba(255,255,255,0.15)"; roundRect(cx, cy+14, cw, 10, 5); ctx.fill();
  ctx.fillStyle = ready ? "#ffd76b" : "#5c7bb5";
  roundRect(cx, cy+14, cw * (ready ? 1 : 1 - player.specialCd/6), 10, 5); ctx.fill();
  ctx.fillStyle = ready ? "#ffd76b" : "#9db8e8"; ctx.font = "bold 13px sans-serif";
  ctx.fillText(ready ? "E：必殺技オーラブラスト 使用可能！" : "E：必殺技クールダウン中… " + player.specialCd.toFixed(1) + "s", cx, cy+10);
  ctx.restore();
  ctx.fillStyle = "rgba(200,220,255,0.85)"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("TIME " + elapsed.toFixed(1), W/2, 34); ctx.textAlign = "left";
}

// ---------- update ----------
function fireSpecial() {
  if (player.specialCd > 0 || state !== "playing") return;
  player.specialCd = 6;
  beam = { t: 0, dur: 0.38, y: player.y };
  sfx.special(); shake = Math.max(shake, 7);
  if (Math.abs(mars.y - player.y) < 62) {
    mars.hp -= 30; mars.flash = 0.18;
    dmgNum(mars.x, mars.y - mars.r - 16, "-30", "#ffd76b");
    sparks(mars.x, mars.y, ["#ffd76b","#ff9a5c","#ffffff"], 34);
    sfx.hit();
    if (mars.hp <= 0) { endGame(true); return; }
  }
  for (let i = 0; i < 22; i++) particles.push({ x: player.x + player.r + Math.random()*(W-player.x), y: player.y + (Math.random()-0.5)*54, vx: 60+Math.random()*140, vy: (Math.random()-0.5)*40, life: 0.3+Math.random()*0.3, t: 0, r: 1.5+Math.random()*3, c: "#ffe98a" });
}

function demoControl(dt) {
  // simple AI for recording footage
  let targetY = mars.y + Math.sin(performance.now()/600)*70;
  let targetX = 230 + Math.sin(performance.now()/1500)*60;
  let nearest = null, nd = 1e9;
  for (const b of ebullets) { const d = (b.x-player.x)**2 + (b.y-player.y)**2; if (b.x > player.x-10 && d < nd) { nd = d; nearest = b; } }
  if (nearest && nd < 200*200) targetY = player.y + (player.y < nearest.y ? -130 : 130);
  player.x += Math.max(-300*dt, Math.min(300*dt, targetX - player.x));
  player.y += Math.max(-300*dt, Math.min(300*dt, targetY - player.y));
  keys["Space"] = true;
  if (player.specialCd <= 0 && Math.abs(mars.y - player.y) < 40) fireSpecial();
}

function update(dt) {
  elapsed = (performance.now() - startTime) / 1000;
  if (DEMO) demoControl(dt);
  // player movement
  const sp = 300;
  if (keys["KeyA"] || keys["ArrowLeft"]) player.x -= sp*dt;
  if (keys["KeyD"] || keys["ArrowRight"]) player.x += sp*dt;
  if (keys["KeyW"] || keys["ArrowUp"]) player.y -= sp*dt;
  if (keys["KeyS"] || keys["ArrowDown"]) player.y += sp*dt;
  player.x = Math.max(player.r+6, Math.min(W/2+160, player.x));
  player.y = Math.max(player.r+70, Math.min(H-player.r-14, player.y));
  // shooting
  player.fireCd -= dt; player.specialCd = Math.max(0, player.specialCd - dt);
  player.flash = Math.max(0, player.flash - dt); mars.flash = Math.max(0, mars.flash - dt);
  if (keys["Space"] && player.fireCd <= 0) {
    player.fireCd = 0.13;
    bullets.push({ x: player.x + player.r + 4, y: player.y - 8, vx: 560, vy: 0, r: 5 });
    bullets.push({ x: player.x + player.r + 4, y: player.y + 8, vx: 560, vy: 0, r: 5 });
    sfx.shoot();
  }
  if (keys["KeyE"]) fireSpecial();
  // mars AI
  mars.t += dt;
  mars.phase = mars.hp < mars.max*0.5 ? 2 : 1;
  const baseX = W - 230 + Math.sin(mars.t*0.7)*46;
  mars.x += (baseX - mars.x) * Math.min(1, dt*2);
  const targetY = H/2 + Math.sin(mars.t * (mars.phase === 2 ? 1.5 : 0.9)) * 190 + (player.y - H/2) * 0.25;
  mars.y += Math.max(-(mars.phase === 2 ? 200 : 130)*dt, Math.min((mars.phase === 2 ? 200 : 130)*dt, targetY - mars.y));
  mars.fireCd -= dt;
  if (mars.fireCd <= 0) {
    mars.fireCd = mars.phase === 2 ? 0.85 : 1.25;
    const dx = player.x - mars.x, dy = player.y - mars.y, len = Math.hypot(dx, dy) || 1, spd = 300;
    ebullets.push({ x: mars.x - mars.r - 4, y: mars.y, vx: dx/len*spd, vy: dy/len*spd, r: 7 });
    if (mars.phase === 2) {
      ebullets.push({ x: mars.x - mars.r - 4, y: mars.y, vx: dx/len*spd, vy: (dy/len + 0.22)*spd, r: 7 });
      ebullets.push({ x: mars.x - mars.r - 4, y: mars.y, vx: dx/len*spd, vy: (dy/len - 0.22)*spd, r: 7 });
    }
    sfx.eshoot();
  }
  // bullets
  for (const b of bullets) b.x += b.vx*dt;
  for (const b of ebullets) { b.x += b.vx*dt; b.y += b.vy*dt; }
  bullets = bullets.filter(b => b.x < W + 30);
  ebullets = ebullets.filter(b => b.x > -30 && b.y > -30 && b.y < H + 30);
  // collisions: player bullets -> mars
  for (const b of bullets) {
    if ((b.x-mars.x)**2 + (b.y-mars.y)**2 < (mars.r + b.r)**2) {
      b.x = W + 999; mars.hp -= 5; mars.flash = 0.12;
      dmgNum(mars.x + (Math.random()-0.5)*30, mars.y - mars.r - 10, "-5", "#aee2ff");
      sparks(b.x > W ? mars.x - mars.r : b.x, b.y, ["#7ec8ff","#ffffff","#ffd76b"], 7);
      sfx.hit();
      if (mars.hp <= 0) { endGame(true); return; }
    }
  }
  bullets = bullets.filter(b => b.x < W + 30);
  // collisions: mars bullets -> player
  for (const b of ebullets) {
    if ((b.x-player.x)**2 + (b.y-player.y)**2 < (player.r*0.92 + b.r)**2) {
      b.x = -999; player.hp -= 8; player.flash = 0.16; shake = Math.max(shake, 6);
      dmgNum(player.x, player.y - player.r - 12, "-8", "#ff8f8f");
      sparks(player.x + player.r*0.6, player.y, ["#ff6b6b","#ffd76b","#ffffff"], 10);
      sfx.hit();
      if (player.hp <= 0) { endGame(false); return; }
    }
  }
  ebullets = ebullets.filter(b => b.x > -100);
  // particles & damage numbers
  for (const p of particles) { p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.985; p.vy *= 0.985; }
  particles = particles.filter(p => p.t < p.life);
  for (const d of dmgNums) { d.t += dt; d.y -= 44*dt; }
  dmgNums = dmgNums.filter(d => d.t < 0.8);
  if (beam) { beam.t += dt; if (beam.t > beam.dur) beam = null; }
  shake = Math.max(0, shake - dt*30);
}

// ---------- draw ----------
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#060b26"); bg.addColorStop(0.6, "#04081a"); bg.addColorStop(1, "#02040e");
  ctx.fillStyle = bg; ctx.fillRect(-30, -30, W+60, H+60);
  for (const n of nebulae) { const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r); g.addColorStop(0, n.c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(n.x-n.r, n.y-n.r, n.r*2, n.r*2); }
  const now = performance.now()/1000;
  for (const s of stars) {
    s.x -= s.s * 0.016; if (s.x < -4) { s.x = W + 4; s.y = Math.random()*H; }
    ctx.globalAlpha = 0.45 + 0.4*Math.sin(now*2 + s.tw);
    ctx.fillStyle = "#dfeaff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (player && state !== "over") {}
  if (player) {
    // beam under planets
    if (beam) {
      const a = 1 - beam.t/beam.dur;
      const grd = ctx.createLinearGradient(player.x, 0, W, 0);
      grd.addColorStop(0, "rgba(255,240,170," + (0.95*a) + ")"); grd.addColorStop(1, "rgba(255,150,60," + (0.55*a) + ")");
      ctx.fillStyle = grd;
      ctx.fillRect(player.x + player.r, beam.y - 27, W - player.x, 54);
      ctx.fillStyle = "rgba(255,255,255," + (0.9*a) + ")";
      ctx.fillRect(player.x + player.r, beam.y - 9, W - player.x, 18);
    }
    if (!(state === "over" && player.hp <= 0)) drawEarth(player);
    if (!(state === "over" && mars.hp <= 0)) drawMars(mars);
    for (const b of bullets) {
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r*2.4);
      g.addColorStop(0, "rgba(160,225,255,0.9)"); g.addColorStop(1, "rgba(160,225,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.4, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#eaf7ff"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.62, 0, 6.283); ctx.fill();
    }
    for (const b of ebullets) {
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r*2.2);
      g.addColorStop(0, "rgba(255,150,80,0.95)"); g.addColorStop(1, "rgba(255,80,40,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#ffe3b0"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.55, 0, 6.283); ctx.fill();
    }
    for (const p of particles) { ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.font = "bold 17px sans-serif"; ctx.textAlign = "center";
    for (const d of dmgNums) { ctx.globalAlpha = 1 - d.t/0.8; ctx.fillStyle = d.color; ctx.fillText(d.txt, d.x, d.y); }
    ctx.globalAlpha = 1; ctx.textAlign = "left";
    drawHUD();
    if (state === "title") {
      ctx.fillStyle = "rgba(220,235,255,0.9)"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("EARTH vs MARS", W/2, H - 26); ctx.textAlign = "left";
    }
  }
  ctx.restore();
}

let last = performance.now();
function loop(nowMs) {
  const dt = Math.min(0.033, (nowMs - last)/1000); last = nowMs;
  if (state === "playing") update(dt);
  else if (state === "over") { // keep particles drifting on result screen
    for (const p of particles) { p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; }
    particles = particles.filter(p => p.t < p.life);
  }
  draw();
  requestAnimationFrame(loop);
}
reset();
if (DEMO) startGame();
requestAnimationFrame(loop);
</script>
